CONFIG_ZTEST=y

# Fine tick resolution so blink periods (ms) aren't aliased by the tick rate
# when sampling the emulated GPIO output between toggles.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

CONFIG_ZBOOK_LED=y
CONFIG_LED_LOG_LEVEL_ERR=y

# Small periods so blink tests don't burn real wall-clock/simulated time.
CONFIG_ZBOOK_LED_BLINK_DEFAULT_MS=20
CONFIG_ZBOOK_LED_BLINK_SLOW_MS=40
CONFIG_ZBOOK_LED_BLINK_FAST_MS=10
