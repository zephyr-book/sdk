CONFIG_GPIO=y

# interface/'s ZBOOK_SPI Kconfig symbol currently defaults to y repo-wide
# (interface/Kconfig.protocols), so it would otherwise pull in zbook_spi.c
# looking for a "zbook_spi" devicetree node that doesn't exist on this
# board. This app is pure Zephyr and never calls into interface/ at all --
# turn it back off explicitly rather than relying on that default staying
# what it is.
CONFIG_ZBOOK_SPI=n
